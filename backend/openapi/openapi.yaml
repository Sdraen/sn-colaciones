openapi: 3.1.0
info:
  title: SN Colaciones API
  version: 0.1.0
  description: API para pedidos, menús y administración de colaciones.
servers:
  - url: http://localhost:4000
paths:
  /api/health:
    get:
      summary: Comprueba el estado del backend
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status:
                    const: ok
                  service:
                    const: sn-colaciones-backend
                  timestamp:
                    type: string
                    format: date-time
